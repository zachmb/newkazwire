<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" id="favicon" href="/logo.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#1f2023" />
	<!-- Apply saved/system theme before paint (no flash, works on every route) -->
	<script>
		(function () {
			try {
				var t = localStorage.getItem('kz-theme');
				if (t !== 'light' && t !== 'dark') {
					t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('data-theme', t);
			} catch (e) {
				document.documentElement.setAttribute('data-theme', 'light');
			}
		})();
	</script>
	<!-- Perf: warm up the connection to the game/asset bucket + fonts -->
	<link rel="preconnect" href="https://objectstorage.us-chicago-1.oraclecloud.com" crossorigin />
	<link rel="dns-prefetch" href="https://objectstorage.us-chicago-1.oraclecloud.com" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<!-- Google AdSense loader (ca-pub-7648886706850999, matches static/ads.txt). Without
	     this the adsbygoogle ad units across the site never fill. -->
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7648886706850999" crossorigin="anonymous"></script>
	<!-- Google Analytics 4 (G-5FV89GN2T2), loaded DIRECTLY via gtag.js — NOT through the
	     GTM container (GTM-KVGNDGZ7). The container only ever carried GA4, but its tags sit
	     behind a consent/privacy framework (TCF/GPP) that nothing on this ad-only site ever
	     answers, so analytics_storage stayed denied and no hits were sent — GA showed nothing
	     on every domain. Loading gtag.js here with consent granted fires real hits on every
	     hostname and route. SPA page_views are sent manually from the root layout
	     (send_page_view:false). GA4 Enhanced Measurement (set on the data stream) replaces the
	     container's old scroll/outbound-click auto-events. If you re-add a GA4 tag inside the
	     GTM container, PAUSE it or you'll double-count. Measurement ID must match src/lib/ga.ts. -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-5FV89GN2T2"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		window.gtag = gtag;
		gtag('js', new Date());
		gtag('consent', 'default', {
			analytics_storage: 'granted',
			ad_storage: 'granted',
			ad_user_data: 'granted',
			ad_personalization: 'granted'
		});
		gtag('config', 'G-5FV89GN2T2', { send_page_view: false });
	</script>
	%sveltekit.head%
</head>

<body class="bg-base-100 text-base-content font-sans">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
