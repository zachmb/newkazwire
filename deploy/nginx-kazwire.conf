# Kazwire nginx site config.
# Place at /etc/nginx/sites-available/kazwire, symlink into sites-enabled.
# certbot --nginx will inject the TLS (443) server block + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name kazwire.com www.kazwire.com;

    # gzip (SvelteKit HTML/JS/CSS/JSON from the node app)
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;

    # SvelteKit hashed assets are immutable — cache hard
    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ultraviolet bare-server (proxy backend) + its websocket upgrades
    location /bare/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # SvelteKit app (adapter-node)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    client_max_body_size 25m;
}
